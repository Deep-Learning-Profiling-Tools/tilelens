# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep `uv run` from re-syncing the environment to the lockfile, which
      # would undo the Triton 3.8 pin installed with `uv pip install`.
      UV_NO_SYNC: "1"

    steps:
    - uses: actions/checkout@v3
      with:
        path: 'tilelens'

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Lint with pre-commit
      run: |
        cd tilelens
        pip install pre-commit
        pre-commit run --all-files

    - name: Install Dependencies
      run: |
        cd tilelens
        uv sync --extra test

    - name: Install Triton 3.8
      run: |
        cd tilelens
        uv pip install triton==3.8.0
        uv pip install "git+https://github.com/triton-lang/triton.git@v3.8.0#subdirectory=python/triton_kernels"

    - name: Run frontend tests
      run: |
        cd tilelens
        npm install
        npm run test:frontend

    - name: Test with pytest
      run: |
        cd tilelens
        uv run pytest tests -n auto --ignore=tests/end_to_end/test_triton_kernels.py

    - name: Install TileLens with NKI extras
      run: |
        cd tilelens
        uv sync --extra test --extra nki

    - name: Install Triton 3.8 (NKI)
      run: |
        cd tilelens
        uv pip install triton==3.8.0
        uv pip install "git+https://github.com/triton-lang/triton.git@v3.8.0#subdirectory=python/triton_kernels"

    - name: Run full (Triton + NKI) pytest suite
      run: |
        cd tilelens
        uv run pytest tests -m "" -n auto --ignore=tests/end_to_end/test_triton_kernels.py

  test-pip-install:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'

    - name: Install with pip
      run: pip install ".[test]"

    - name: Verify installation
      working-directory: ${{ runner.temp }}
      run: |
        python - <<'PY'
        import tilelens
        import triton_viz
        from tilelens.clients import Sanitizer
        from triton_viz.clients import Sanitizer as LegacySanitizer
        from tilelens.core.trace import launches
        from triton_viz.core.trace import launches as legacy_launches

        assert triton_viz.trace is tilelens.trace
        assert triton_viz.config is tilelens.config
        assert LegacySanitizer is Sanitizer
        assert legacy_launches is launches
        print(tilelens.__version__)
        PY
